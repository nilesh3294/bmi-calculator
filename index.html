<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>BMI Calculator</h1>

    <label>Height (cm)</label><br>
    <input type="number" id="height"><br><br>

    <label>Weight (kg)</label><br>
    <input type="number" id="weight"><br><br>

    <button onclick="calculateBMI()">Calculate BMI</button>

    <h2 id="result"></h2>

<h2>Daily Calories Calculator</h2>

<label>Age</label><br>
<input type="number" id="age"><br><br>

<label>Gender</label><br>
<select id="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select><br><br>

<label>Activity Level</label><br>
<select id="activity">
<option value="1.2">Sedentary</option>
<option value="1.375">Light Exercise</option>
<option value="1.55">Moderate Exercise</option>
<option value="1.725">Heavy Exercise</option>
</select><br><br>

<button onclick="calculateCalories()">Calculate Daily Calories</button>

<h2 id="caloriesResult"></h2>
</div>

<script src="script.js"></script>
</body>
</html>
